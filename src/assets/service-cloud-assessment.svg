<svg xmlns="http://www.w3.org/2000/svg" viewBox="150 0 900 900" width="900" height="900" role="img" aria-label="Cloud security assessment illustration">
  <defs>
    <linearGradient id="cl-bg" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#0B0B0E"/>
      <stop offset="1" stop-color="#191920"/>
    </linearGradient>
    <radialGradient id="cl-glow" cx="0.5" cy="0.36" r="0.62">
      <stop offset="0" stop-color="#E11D2E" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#E11D2E" stop-opacity="0"/>
    </radialGradient>
    <pattern id="cl-grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0v56" fill="none" stroke="#FFFFFF" stroke-opacity="0.045"/>
    </pattern>
    <linearGradient id="cl-glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.035"/>
    </linearGradient>
    <linearGradient id="cl-accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF7A83"/>
      <stop offset="1" stop-color="#D6192A"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="900" fill="url(#cl-bg)"/>
  <rect width="1200" height="900" fill="url(#cl-grid)"/>
  <rect width="1200" height="900" fill="url(#cl-glow)"/>

  <g fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1.5">
    <circle cx="600" cy="420" r="240"/>
    <circle cx="600" cy="420" r="330"/>
    <circle cx="600" cy="420" r="420"/>
  </g>

  <!-- assessment boundary -->
  <rect x="398" y="198" width="404" height="286" rx="38" fill="none" stroke="#FFFFFF" stroke-opacity="0.26" stroke-width="2.2" stroke-dasharray="10 10"/>

  <!-- cloud -->
  <g transform="translate(600 332)" fill="none" stroke="url(#cl-accent)" stroke-width="3.8" stroke-linecap="round" stroke-linejoin="round">
    <g transform="translate(-116 -104) scale(11)" stroke-width="0.35">
      <path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"/>
    </g>
  </g>

  <!-- shield inside cloud -->
  <g transform="translate(600 318)" fill="none" stroke="#FFFFFF" stroke-opacity="0.75" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <g transform="translate(-24 -28) scale(2.5)" stroke-width="0.6">
      <path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/>
      <path d="m9 12 2 2 4-4" stroke="#FF7A83" stroke-width="0.85"/>
    </g>
  </g>

  <!-- server rack -->
  <g transform="translate(480 566)" fill="url(#cl-glass)" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="2.2">
    <rect width="240" height="52" rx="12"/>
    <rect y="64" width="240" height="52" rx="12"/>
    <rect y="128" width="240" height="52" rx="12"/>
    <g fill="#FF7A83" stroke="none">
      <circle cx="22" cy="26" r="4"/>
      <circle cx="22" cy="90" r="4"/>
      <circle cx="22" cy="154" r="4"/>
    </g>
    <g fill="#FFFFFF" fill-opacity="0.20" stroke="none">
      <rect x="40" y="20" width="128" height="11" rx="5.5"/>
      <rect x="40" y="84" width="96" height="11" rx="5.5"/>
      <rect x="40" y="148" width="144" height="11" rx="5.5"/>
    </g>
  </g>

  <!-- connectors -->
  <g stroke="#FFFFFF" stroke-opacity="0.26" stroke-width="2" stroke-dasharray="7 8" fill="none">
    <path d="M600 462v56"/>
    <path d="M600 534v26"/>
  </g>

  <!-- misconfiguration marker -->
  <g transform="translate(770 258)">
    <circle r="24" fill="#E11D2E" fill-opacity="0.20" stroke="#FF7A83" stroke-opacity="0.9" stroke-width="1.5"/>
    <path d="M0 -8v8" stroke="#FF7A83" stroke-width="2.6" stroke-linecap="round"/>
    <circle cy="6.5" r="1.9" fill="#FF7A83"/>
  </g>

  <!-- labels -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" letter-spacing="3" fill="#FFFFFF" fill-opacity="0.62">
    <rect x="336" y="300" width="170" height="48" rx="12" fill="url(#cl-glass)" stroke="#FFFFFF" stroke-opacity="0.22"/>
    <circle cx="358" cy="324" r="4" fill="#FF7A83"/>
    <text x="374" y="330">IDENTITY</text>

    <rect x="716" y="592" width="152" height="48" rx="12" fill="url(#cl-glass)" stroke="#FFFFFF" stroke-opacity="0.22"/>
    <circle cx="738" cy="616" r="4" fill="#FF7A83"/>
    <text x="754" y="622">EXPOSURE</text>

    <rect x="690" y="656" width="200" height="48" rx="12" fill="url(#cl-glass)" stroke="#FFFFFF" stroke-opacity="0.22"/>
    <circle cx="712" cy="680" r="4" fill="#FF7A83"/>
    <text x="728" y="686">PERMISSIONS</text>
  </g>
</svg>
