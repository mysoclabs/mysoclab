<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" role="img" aria-labelledby="title desc">
  <title id="title">MySOC Labs Security Operations Center dashboard</title>
  <desc id="desc">A dark security operations dashboard showing live event volume, threat activity chart, active alerts and a real-time event stream.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0A0C11"/>
      <stop offset="1" stop-color="#07080B"/>
    </linearGradient>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F4343D" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#F4343D" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="topline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F4343D" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#F4343D" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#F4343D" stop-opacity="0"/>
    </linearGradient>
    <style>
      .ui { font-family: 'DM Sans', 'Segoe UI', Arial, sans-serif; }
      .mono { font-family: 'Cascadia Mono', 'Consolas', 'SFMono-Regular', monospace; }
      .lbl { font-size: 11px; letter-spacing: 1.6px; fill: #6E7889; font-weight: 600; }
      .muted { fill: #7D8797; }
      .bright { fill: #E8ECF3; }
      .panel { fill: #0F1218; stroke: #1B2029; stroke-width: 1; }
    </style>
  </defs>

  <rect width="1200" height="750" fill="url(#bg)"/>
  <rect width="1200" height="1" fill="url(#topline)"/>

  <!-- app bar -->
  <g class="ui">
    <rect x="0" y="1" width="1200" height="59" fill="#0B0D12"/>
    <line x1="0" y1="60" x2="1200" y2="60" stroke="#191D25"/>
    <rect x="24" y="18" width="24" height="24" rx="6" fill="#F4343D"/>
    <path d="M36 24.5l6 2.4v4.4c0 3.4-2.5 5.6-6 6.9-3.5-1.3-6-3.5-6-6.9v-4.4z" fill="#0B0D12" opacity="0.9"/>
    <text x="60" y="36" font-size="16" font-weight="700" fill="#F1F3F7">MySOC Labs</text>
    <line x1="163" y1="22" x2="163" y2="38" stroke="#2A303B"/>
    <text x="180" y="35" font-size="12" letter-spacing="2.4" fill="#8A93A2" font-weight="600">SECURITY OPERATIONS CENTER</text>
    <circle cx="1001" cy="30" r="4" fill="#3FAE7A"/>
    <text x="1013" y="34" font-size="11.5" letter-spacing="1.6" fill="#9AA3B2" font-weight="700">LIVE</text>
    <text x="1062" y="34" font-size="12" fill="#7D8797" class="mono">14:32:08 UTC</text>
    <circle cx="1160" cy="30" r="12" fill="#1A1F29" stroke="#2A303B"/>
    <text x="1160" y="34" font-size="10.5" text-anchor="middle" fill="#C6CDD9" font-weight="700">AK</text>
  </g>

  <!-- KPI tiles -->
  <g class="ui">
    <rect x="24" y="84" width="276" height="88" rx="10" class="panel"/>
    <text x="42" y="108" class="lbl">EVENTS / MIN</text>
    <text x="42" y="146" font-size="27" font-weight="700" class="bright">12,480</text>
    <text x="160" y="146" font-size="11.5" fill="#3FAE7A" font-weight="600">▲ 8.4%</text>

    <rect x="316" y="84" width="276" height="88" rx="10" class="panel"/>
    <text x="334" y="108" class="lbl">OPEN ALERTS</text>
    <text x="334" y="146" font-size="27" font-weight="700" class="bright">6</text>
    <text x="366" y="146" font-size="11.5" fill="#F4343D" font-weight="600">2 high priority</text>

    <rect x="608" y="84" width="276" height="88" rx="10" class="panel"/>
    <text x="626" y="108" class="lbl">MEAN TIME TO DETECT</text>
    <text x="626" y="146" font-size="27" font-weight="700" class="bright">42s</text>
    <text x="686" y="146" font-size="11.5" fill="#3FAE7A" font-weight="600">▼ 18%</text>

    <rect x="900" y="84" width="276" height="88" rx="10" class="panel"/>
    <text x="918" y="108" class="lbl">THREATS BLOCKED TODAY</text>
    <text x="918" y="146" font-size="27" font-weight="700" class="bright">1,283</text>
    <text x="1036" y="146" font-size="11.5" fill="#3FAE7A" font-weight="600">▲ 124</text>
  </g>

  <!-- threat activity chart -->
  <g class="ui">
    <rect x="24" y="190" width="740" height="240" rx="10" class="panel"/>
    <text x="44" y="218" font-size="15" font-weight="700" class="bright">Threat activity</text>
    <text x="44" y="236" font-size="11.5" class="muted">Detected vs blocked · last 24 hours</text>
    <g font-size="10.5" class="muted">
      <circle cx="602" cy="222" r="3" fill="#F4343D"/>
      <text x="612" y="226">Detected</text>
      <circle cx="686" cy="222" r="3" fill="#5E6879"/>
      <text x="696" y="226">Blocked</text>
    </g>

    <g stroke="#171B22" stroke-width="1">
      <line x1="44" y1="278" x2="744" y2="278"/>
      <line x1="44" y1="316" x2="744" y2="316"/>
      <line x1="44" y1="354" x2="744" y2="354"/>
      <line x1="44" y1="392" x2="744" y2="392"/>
    </g>

    <path d="M44 366 L86 352 L128 360 L170 330 L212 341 L254 312 L296 322 L338 296 L380 309 L422 280 L464 292 L506 262 L548 275 L590 244 L632 256 L674 236 L716 246 L744 238 L744 392 L44 392 Z" fill="url(#area)"/>
    <path d="M44 366 L86 352 L128 360 L170 330 L212 341 L254 312 L296 322 L338 296 L380 309 L422 280 L464 292 L506 262 L548 275 L590 244 L632 256 L674 236 L716 246 L744 238" fill="none" stroke="#F4343D" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M44 378 L86 370 L128 374 L170 358 L212 364 L254 350 L296 356 L338 342 L380 349 L422 334 L464 340 L506 326 L548 333 L590 318 L632 324 L674 312 L716 318 L744 312" fill="none" stroke="#5E6879" stroke-width="1.6" stroke-dasharray="4 4" opacity="0.9"/>

    <line x1="590" y1="244" x2="590" y2="392" stroke="#F4343D" stroke-width="1" stroke-dasharray="3 4" opacity="0.45"/>
    <circle cx="590" cy="244" r="4.5" fill="#F4343D" stroke="#0F1218" stroke-width="2"/>

    <g font-size="10" class="muted">
      <text x="44" y="414">00:00</text>
      <text x="208" y="414">06:00</text>
      <text x="372" y="414">12:00</text>
      <text x="536" y="414">18:00</text>
      <text x="708" y="414">24:00</text>
    </g>
  </g>

  <!-- active alerts -->
  <g class="ui">
    <rect x="780" y="190" width="396" height="240" rx="10" class="panel"/>
    <text x="800" y="218" font-size="15" font-weight="700" class="bright">Active alerts</text>
    <rect x="1068" y="202" width="88" height="21" rx="10.5" fill="#1E1215" stroke="#4A1D23"/>
    <text x="1112" y="217" font-size="10" letter-spacing="1.2" text-anchor="middle" fill="#F2797F" font-weight="700">6 OPEN</text>

    <g>
      <rect x="800" y="240" width="3" height="30" rx="1.5" fill="#F4343D"/>
      <text x="814" y="256" font-size="12.5" font-weight="600" fill="#EDF0F5">Suspicious PowerShell execution</text>
      <text x="814" y="271" font-size="10.5" class="muted mono">FIN-WS-014</text>
      <text x="1156" y="271" font-size="10" text-anchor="end" class="muted">2m</text>

      <rect x="800" y="292" width="3" height="30" rx="1.5" fill="#F4343D"/>
      <text x="814" y="308" font-size="12.5" font-weight="600" fill="#EDF0F5">Multiple failed MFA attempts</text>
      <text x="814" y="323" font-size="10.5" class="muted mono">user: r.mehta</text>
      <text x="1156" y="323" font-size="10" text-anchor="end" class="muted">6m</text>

      <rect x="800" y="344" width="3" height="30" rx="1.5" fill="#D99A3C"/>
      <text x="814" y="360" font-size="12.5" font-weight="600" fill="#EDF0F5">Impossible travel sign-in</text>
      <text x="814" y="375" font-size="10.5" class="muted mono">SG → US · 4,200 km/h</text>
      <text x="1156" y="375" font-size="10" text-anchor="end" class="muted">11m</text>

      <rect x="800" y="396" width="3" height="20" rx="1.5" fill="#5E6879"/>
      <text x="814" y="410" font-size="12.5" font-weight="600" fill="#EDF0F5">New privileged role assigned</text>
      <text x="1156" y="410" font-size="10" text-anchor="end" class="muted">19m</text>
    </g>
  </g>

  <!-- live event stream -->
  <g class="ui">
    <rect x="24" y="446" width="1152" height="280" rx="10" class="panel"/>
    <text x="44" y="474" font-size="15" font-weight="700" class="bright">Live event stream</text>
    <text x="214" y="473" font-size="10" letter-spacing="1.2" fill="#6E7889" font-weight="600">AUTO-REFRESH 5s</text>
    <rect x="1056" y="458" width="100" height="24" rx="6" fill="#141821" stroke="#242B37"/>
    <text x="1106" y="474" font-size="10" letter-spacing="1" text-anchor="middle" fill="#9AA3B2" font-weight="600">EXPORT</text>

    <g font-size="10" letter-spacing="1.4" fill="#6E7889" font-weight="700">
      <text x="44" y="505">TIME</text>
      <text x="150" y="505">SOURCE</text>
      <text x="350" y="505">EVENT</text>
      <text x="900" y="505">SEVERITY</text>
      <text x="1040" y="505">STATUS</text>
    </g>
    <line x1="44" y1="516" x2="1156" y2="516" stroke="#1B2029"/>

    <g font-size="11.5" class="mono">
      <text x="44" y="540" fill="#9AA3B2">14:32:08</text>
      <text x="150" y="540" fill="#C3CAD5">10.24.8.17</text>
      <text x="350" y="540" fill="#E7EBF2">Endpoint blocked: C2 beacon</text>
      <text x="1040" y="540" fill="#3FAE7A">Contained</text>
    </g>
    <rect x="900" y="527" width="52" height="19" rx="4" fill="#1E1215" stroke="#4A1D23"/>
    <text x="926" y="540" font-size="9.5" text-anchor="middle" fill="#F2797F" font-weight="700" letter-spacing="0.8">HIGH</text>
    <line x1="44" y1="554" x2="1156" y2="554" stroke="#141821"/>

    <g font-size="11.5" class="mono">
      <text x="44" y="576" fill="#9AA3B2">14:31:52</text>
      <text x="150" y="576" fill="#C3CAD5">okta-prod</text>
      <text x="350" y="576" fill="#E7EBF2">MFA challenge failed x4</text>
      <text x="1040" y="576" fill="#D99A3C">Investigating</text>
    </g>
    <rect x="900" y="563" width="70" height="19" rx="4" fill="#221A0F" stroke="#4A3A1D"/>
    <text x="935" y="576" font-size="9.5" text-anchor="middle" fill="#E3B369" font-weight="700" letter-spacing="0.8">MEDIUM</text>
    <line x1="44" y1="590" x2="1156" y2="590" stroke="#141821"/>

    <g font-size="11.5" class="mono">
      <text x="44" y="612" fill="#9AA3B2">14:31:40</text>
      <text x="150" y="612" fill="#C3CAD5">45.9.148.3</text>
      <text x="350" y="612" fill="#E7EBF2">WAF: SQL injection attempt on /login</text>
      <text x="1040" y="612" fill="#3FAE7A">Blocked</text>
    </g>
    <rect x="900" y="599" width="52" height="19" rx="4" fill="#1E1215" stroke="#4A1D23"/>
    <text x="926" y="612" font-size="9.5" text-anchor="middle" fill="#F2797F" font-weight="700" letter-spacing="0.8">HIGH</text>
    <line x1="44" y1="626" x2="1156" y2="626" stroke="#141821"/>

    <g font-size="11.5" class="mono">
      <text x="44" y="648" fill="#9AA3B2">14:30:19</text>
      <text x="150" y="648" fill="#C3CAD5">aws-prod</text>
      <text x="350" y="648" fill="#E7EBF2">IAM policy modified · role: deploy</text>
      <text x="1040" y="648" fill="#D99A3C">Review</text>
    </g>
    <rect x="900" y="635" width="70" height="19" rx="4" fill="#221A0F" stroke="#4A3A1D"/>
    <text x="935" y="648" font-size="9.5" text-anchor="middle" fill="#E3B369" font-weight="700" letter-spacing="0.8">MEDIUM</text>
    <line x1="44" y1="662" x2="1156" y2="662" stroke="#141821"/>

    <g font-size="11.5" class="mono">
      <text x="44" y="684" fill="#9AA3B2">14:29:07</text>
      <text x="150" y="684" fill="#C3CAD5">mail-gw</text>
      <text x="350" y="684" fill="#E7EBF2">Phishing link detonated in sandbox</text>
      <text x="1040" y="684" fill="#8E98A8">Quarantined</text>
    </g>
    <rect x="900" y="671" width="42" height="19" rx="4" fill="#151A22" stroke="#242B37"/>
    <text x="921" y="684" font-size="9.5" text-anchor="middle" fill="#9AA3B2" font-weight="700" letter-spacing="0.8">LOW</text>

    <text x="44" y="712" font-size="9.5" fill="#5E6879" class="mono">SOC-1 · 24/7 coverage · 3 analysts online · 1,412 sources connected</text>
  </g>
</svg>
