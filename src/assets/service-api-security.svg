<svg xmlns="http://www.w3.org/2000/svg" viewBox="150 0 900 900" width="900" height="900" role="img" aria-label="API security testing illustration">
  <defs>
    <linearGradient id="api-bg" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#0B0B0E"/>
      <stop offset="1" stop-color="#191920"/>
    </linearGradient>
    <radialGradient id="api-glow" cx="0.5" cy="0.38" r="0.62">
      <stop offset="0" stop-color="#E11D2E" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#E11D2E" stop-opacity="0"/>
    </radialGradient>
    <pattern id="api-grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0v56" fill="none" stroke="#FFFFFF" stroke-opacity="0.045"/>
    </pattern>
    <linearGradient id="api-glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.035"/>
    </linearGradient>
    <linearGradient id="api-accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF7A83"/>
      <stop offset="1" stop-color="#D6192A"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="900" fill="url(#api-bg)"/>
  <rect width="1200" height="900" fill="url(#api-grid)"/>
  <rect width="1200" height="900" fill="url(#api-glow)"/>

  <g fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1.5">
    <circle cx="600" cy="450" r="240"/>
    <circle cx="600" cy="450" r="330"/>
    <circle cx="600" cy="450" r="420"/>
  </g>

  <!-- request / response nodes -->
  <g fill="url(#api-glass)" stroke="#FFFFFF" stroke-opacity="0.32" stroke-width="2.2">
    <rect x="330" y="400" width="104" height="100" rx="18"/>
    <rect x="766" y="400" width="104" height="100" rx="18"/>
  </g>
  <g fill="none" stroke="#FFFFFF" stroke-opacity="0.65" stroke-width="0.95" stroke-linecap="round" stroke-linejoin="round">
    <g transform="translate(358 432) scale(2)">
      <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/>
      <circle cx="12" cy="7" r="4"/>
    </g>
    <g transform="translate(794 432) scale(2)">
      <ellipse cx="12" cy="5" rx="9" ry="3"/>
      <path d="M3 5v14a9 3 0 0 0 18 0V5"/>
      <path d="M3 12a9 3 0 0 0 18 0"/>
    </g>
  </g>

  <!-- connectors -->
  <g stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="2" stroke-dasharray="7 8" fill="none">
    <path d="M434 450h16"/>
    <path d="M750 450h16"/>
  </g>
  <g fill="#FF7A83">
    <path d="M440 450l-9-5v10z"/>
    <path d="M760 450l9-5v10z"/>
  </g>

  <!-- gateway panel -->
  <rect x="450" y="278" width="300" height="344" rx="26" fill="url(#api-glass)" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="2.4"/>
  <g transform="translate(600 448)" fill="none" stroke="url(#api-accent)" stroke-width="3.8" stroke-linecap="round" stroke-linejoin="round">
    <g transform="translate(-84 -84) scale(7)" stroke-width="0.54">
      <path d="M8 3H7a2 2 0 0 0-2 2v5a2 2 0 0 1-2 2 2 2 0 0 1 2 2v5c0 1.1.9 2 2 2h1"/>
      <path d="M16 21h1a2 2 0 0 0 2-2v-5c0-1.1.9-2 2-2a2 2 0 0 1-2-2V5a2 2 0 0 0-2-2h-1"/>
    </g>
  </g>

  <!-- lock badge -->
  <g transform="translate(600 548)">
    <circle r="34" fill="#0C0C10" stroke="#FF7A83" stroke-opacity="0.8" stroke-width="2.2"/>
    <g transform="translate(-13 -13) scale(1.08)" fill="none" stroke="#FF7A83" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="11" width="18" height="11" rx="2"/>
      <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
    </g>
  </g>

  <!-- status chips -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" letter-spacing="3" fill="#FFFFFF" fill-opacity="0.62">
    <rect x="436" y="190" width="136" height="46" rx="12" fill="url(#api-glass)" stroke="#FFFFFF" stroke-opacity="0.22"/>
    <circle cx="458" cy="213" r="4" fill="#FF7A83"/>
    <text x="474" y="219">AUTH</text>

    <rect x="596" y="190" width="136" height="46" rx="12" fill="url(#api-glass)" stroke="#FFFFFF" stroke-opacity="0.22"/>
    <circle cx="618" cy="213" r="4" fill="#FF7A83"/>
    <text x="634" y="219">RBAC</text>

    <rect x="496" y="672" width="208" height="46" rx="12" fill="url(#api-glass)" stroke="#FFFFFF" stroke-opacity="0.22"/>
    <circle cx="518" cy="695" r="4" fill="#FF7A83"/>
    <text x="534" y="701">LOGIC</text>
  </g>
</svg>
