<svg xmlns="http://www.w3.org/2000/svg" width="640" height="640" viewBox="0 0 640 640" role="img" aria-labelledby="title desc">
  <title id="title">Protective security perimeter</title>
  <desc id="desc">A shielded security emblem at the centre of a rotating network perimeter with connected nodes, representing continuous monitoring and protection.</desc>
  <defs>
    <radialGradient id="aura" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#F4343D" stop-opacity="0.16"/>
      <stop offset="0.55" stop-color="#F4343D" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#F4343D" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="coreFace" cx="0.5" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#1B2029"/>
      <stop offset="0.65" stop-color="#111419"/>
      <stop offset="1" stop-color="#0A0C11"/>
    </radialGradient>
    <linearGradient id="shieldStroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF8A90"/>
      <stop offset="0.5" stop-color="#F4343D"/>
      <stop offset="1" stop-color="#8E1519"/>
    </linearGradient>
    <linearGradient id="shieldFace" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#F4343D" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#F4343D" stop-opacity="0.03"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F4343D" stop-opacity="0"/>
      <stop offset="1" stop-color="#FF8A90" stop-opacity="0.85"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <style>
      .rotor,
      .rotor-rev,
      .sweep,
      .node-pulse,
      .core-breathe {
        transform-box: view-box;
        transform-origin: 320px 320px;
      }
      .rotor { animation: cta-spin 90s linear infinite; }
      .rotor-rev { animation: cta-spin 60s linear infinite reverse; }
      .sweep { animation: cta-spin 26s linear infinite; }
      .node-pulse { animation: cta-pulse 5s ease-in-out infinite; }
      .core-breathe { animation: cta-breathe 9s ease-in-out infinite; }
      @keyframes cta-spin { to { transform: rotate(360deg); } }
      @keyframes cta-pulse {
        0%, 100% { opacity: 0.35; }
        50% { opacity: 1; }
      }
      @keyframes cta-breathe {
        0%, 100% { opacity: 0.45; }
        50% { opacity: 0.75; }
      }
      @media (prefers-reduced-motion: reduce) {
        .rotor, .rotor-rev, .sweep, .node-pulse, .core-breathe { animation: none; }
        .node-pulse { opacity: 0.9; }
      }
    </style>
  </defs>

  <!-- ambient halo -->
  <circle cx="320" cy="320" r="300" fill="url(#aura)"/>

  <!-- static perimeter rings -->
  <circle cx="320" cy="320" r="288" fill="none" stroke="#FFFFFF" stroke-opacity="0.065"/>
  <circle cx="320" cy="320" r="214" fill="none" stroke="#FFFFFF" stroke-opacity="0.075"/>
  <circle cx="320" cy="320" r="156" fill="none" stroke="#F4343D" stroke-opacity="0.16"/>

  <!-- radar sweep (slow single arc) -->
  <g class="sweep">
    <circle cx="320" cy="320" r="288" fill="none" stroke="url(#sweep)" stroke-width="1.6"
            stroke-linecap="round" stroke-dasharray="118 1692" opacity="0.55"/>
  </g>

  <!-- dashed orbit -->
  <g class="rotor">
    <circle cx="320" cy="320" r="214" fill="none" stroke="#FFFFFF" stroke-opacity="0.10"
            stroke-width="1" stroke-dasharray="2 10"/>
  </g>

  <!-- tick marks -->
  <g class="rotor-rev" stroke="#FFFFFF" stroke-opacity="0.16" stroke-width="1">
    <line x1="320" y1="32" x2="320" y2="44"/>
    <line x1="320" y1="596" x2="320" y2="608"/>
    <line x1="32" y1="320" x2="44" y2="320"/>
    <line x1="596" y1="320" x2="608" y2="320"/>
    <line x1="116" y1="116" x2="125" y2="125"/>
    <line x1="524" y1="116" x2="515" y2="125"/>
    <line x1="116" y1="524" x2="125" y2="515"/>
    <line x1="524" y1="524" x2="515" y2="515"/>
  </g>

  <!-- network polygon + spokes -->
  <g stroke="#FFFFFF" stroke-opacity="0.09" stroke-width="1">
    <path d="M320 106 L505 213 L505 427 L320 534 L135 427 L135 213 Z" fill="none"/>
    <line x1="320" y1="106" x2="320" y2="214"/>
    <line x1="505" y1="213" x2="398" y2="258"/>
    <line x1="505" y1="427" x2="398" y2="382"/>
    <line x1="320" y1="534" x2="320" y2="426"/>
    <line x1="135" y1="427" x2="242" y2="382"/>
    <line x1="135" y1="213" x2="242" y2="258"/>
  </g>

  <!-- nodes -->
  <g>
    <circle cx="320" cy="106" r="10" fill="#F4343D" opacity="0.10" class="node-pulse" style="animation-delay:0s"/>
    <circle cx="320" cy="106" r="4" fill="#F4343D"/>

    <circle cx="505" cy="213" r="10" fill="#F4343D" opacity="0.10" class="node-pulse" style="animation-delay:1.2s"/>
    <circle cx="505" cy="213" r="3.4" fill="#EDF0F5" opacity="0.85"/>

    <circle cx="505" cy="427" r="10" fill="#F4343D" opacity="0.10" class="node-pulse" style="animation-delay:2.4s"/>
    <circle cx="505" cy="427" r="4" fill="#F4343D"/>

    <circle cx="320" cy="534" r="10" fill="#F4343D" opacity="0.10" class="node-pulse" style="animation-delay:3.1s"/>
    <circle cx="320" cy="534" r="3.4" fill="#EDF0F5" opacity="0.85"/>

    <circle cx="135" cy="427" r="10" fill="#F4343D" opacity="0.10" class="node-pulse" style="animation-delay:4s"/>
    <circle cx="135" cy="427" r="4" fill="#F4343D"/>

    <circle cx="135" cy="213" r="10" fill="#F4343D" opacity="0.10" class="node-pulse" style="animation-delay:2s"/>
    <circle cx="135" cy="213" r="3.4" fill="#EDF0F5" opacity="0.85"/>
  </g>

  <!-- cores -->
  <g class="core-breathe">
    <circle cx="320" cy="320" r="112" fill="#F4343D" opacity="0.08" filter="url(#soft)"/>
  </g>
  <circle cx="320" cy="320" r="104" fill="none" stroke="#FFFFFF" stroke-opacity="0.08"/>
  <circle cx="320" cy="320" r="92" fill="#0A0C11"/>
  <circle cx="320" cy="320" r="92" fill="none" stroke="#FFFFFF" stroke-opacity="0.10"/>
  <circle cx="320" cy="320" r="76" fill="url(#coreFace)" stroke="#F4343D" stroke-opacity="0.22"/>

  <!-- fine ticks inside the emblem -->
  <g stroke="#FFFFFF" stroke-opacity="0.10">
    <line x1="320" y1="232" x2="320" y2="240"/>
    <line x1="320" y1="400" x2="320" y2="408"/>
    <line x1="232" y1="320" x2="240" y2="320"/>
    <line x1="400" y1="320" x2="408" y2="320"/>
  </g>

  <!-- shield -->
  <g>
    <path d="M320 268 L364 284 L364 322 C364 352 345 372 320 384 C295 372 276 352 276 322 L276 284 Z"
          fill="url(#shieldFace)" stroke="url(#shieldStroke)" stroke-width="2.4" stroke-linejoin="round"/>
    <path d="M320 278 L354 291 L354 321 C354 345 339 362 320 372 C301 362 286 345 286 321 L286 291 Z"
          fill="none" stroke="#FFFFFF" stroke-opacity="0.07"/>
    <path d="M303 322 L314 333 L338 308" fill="none" stroke="#FF9CA1" stroke-width="4.2"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- outer orbit satellites -->
  <g fill="#FFFFFF" fill-opacity="0.55">
    <circle cx="534" cy="320" r="2.2"/>
    <circle cx="106" cy="320" r="2.2"/>
  </g>
</svg>

